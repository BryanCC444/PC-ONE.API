<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PC One - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Optional: Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom styles -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="bg-overlay">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card shadow-lg p-4">
                        <div class="text-center mb-3">
                            <h2 class="fw-bold mb-0">PC One</h2>
                            <p class="text-muted small">Acceso al sistema</p>
                        </div>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input id="username" class="form-control" required placeholder="admin" />
                                <div class="invalid-feedback">Ingresa tu usuario</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input id="password" type="password" class="form-control" required placeholder="••••••••" />
                                <div class="invalid-feedback">Ingresa tu contraseña</div>
                            </div>

                            <div class="d-grid mb-2">
                                <button id="btnLogin" type="button" class="btn btn-primary btn-lg">
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                                    Iniciar sesión
                                </button>
                            </div>

                            <div id="loginMsg" class="text-center small text-danger mb-2" role="alert" aria-live="polite"></div>

                            <div class="text-center small text-muted">
                                ¿Problemas para entrar? Contacta al administrador.
                            </div>
                        </form>

                        <hr />

                        <div class="text-center small text-muted">
                            Demo local · Backend en <code>http://localhost:5000</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
